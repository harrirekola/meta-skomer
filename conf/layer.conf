# Layer configuration for meta-skomer
#
# This layer targets the Samsung Galaxy Xcover 2 (GT-S7710, codename
# "skomer"), an ST-Ericsson NovaThor U8500 device. The device's eMMC is
# permanently write-protected, so the images produced here are intended to
# be booted from an SD card via the stock U-Boot.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "skomer"
BBFILE_PATTERN_skomer = "^${LAYERDIR}/"
BBFILE_PRIORITY_skomer = "10"

# Let the wic class find wic/skomer.wks from this layer.
WKS_SEARCH_PATH:prepend = "${LAYERDIR}/wic:"

LAYERVERSION_skomer = "1"

# mmc-utils lives in meta-openembedded/meta-oe
LAYERDEPENDS_skomer = "core openembedded-layer"

# Add the release you are using if it is newer than the ones listed here.
LAYERSERIES_COMPAT_skomer = "scarthgap styhead walnascar whinlatter"
