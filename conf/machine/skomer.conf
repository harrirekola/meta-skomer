#@TYPE: Machine
#@NAME: Samsung Galaxy Xcover 2 (GT-S7710 / skomer)
#@DESCRIPTION: ST-Ericsson NovaThor U8500, ARM Cortex-A9, 1 GiB RAM, SD boot

DEFAULTTUNE = "cortexa9hf-neon"
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

MACHINE_FEATURES = "usbhost usbgadget ext2 ext4 screen wifi bluetooth"

SERIAL_CONSOLES = "115200;ttyAMA2"
SERIAL_CONSOLES_CHECK = "${SERIAL_CONSOLES}"

KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "st/ste-ux500-samsung-skomer.dtb"

PREFERRED_PROVIDER_virtual/kernel = "linux-skomer"
PREFERRED_VERSION_linux-skomer = "7.2%"

IMAGE_FSTYPES = "ext4 tar.gz wic"
WKS_FILE = "skomer.wks"
IMAGE_BOOT_FILES = "zImage skomer-noemmc.dtb boot.scr"

# Make sure the recipes that deploy the files in IMAGE_BOOT_FILES have run
# their do_deploy task before the wic image is assembled.
WKS_FILE_DEPENDS:append = " skomer-bootimg skomer-bootscript"

MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"

# The eMMC user area is permanently write-protected. Disable it in the DTB
# by default so Linux never tries to write to it. Set to "0" only for
# read-only diagnostics, and never mount its partitions read-write.
SKOMER_DISABLE_EMMC ?= "1"
SKOMER_EMMC_NODE ?= "/soc/mmc@80005000"

# The phone's SD card is /dev/mmcblk0. Partition 1 is the FAT boot
# partition, partition 2 is the ext4 rootfs.
SKOMER_BOOT_CMDLINE ?= "console=ttyAMA2,115200 root=/dev/mmcblk0p2 rw rootwait"

# Android v0 boot-image layout used by the stock U-Boot on this device.
# These are the same values as the working pmOS image and deviceinfo.
SKOMER_BOOTIMG_BASE ?= "0x00000000"
SKOMER_BOOTIMG_KERNEL_OFFSET ?= "0x00008000"
SKOMER_BOOTIMG_RAMDISK_OFFSET ?= "0x01000000"
SKOMER_BOOTIMG_SECOND_OFFSET ?= "0x00f00000"
SKOMER_BOOTIMG_TAGS_OFFSET ?= "0x00000100"
SKOMER_BOOTIMG_PAGESIZE ?= "2048"
